<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>預覽與確認送出</title>
  <style>
    body {
      background-color: #3a3a3a;
      color: #f0f0f0;
      font-family: 'Noto Sans TC', sans-serif;
      margin: 0;
      padding: 1rem;
    }
    h1, h2 {
      text-align: center;
      margin-bottom: 1rem;
    }
    .preview-box {
      background: #4a4a4a;
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 2rem;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    .item {
      margin-bottom: 0.5rem;
    }
    .section-title {
      font-weight: bold;
      margin-top: 2rem;
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
      border-bottom: 1px solid #ccc;
      padding-bottom: 0.2rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2rem;
      overflow-x: auto;
    }
    th, td {
      border: 1px solid #666;
      padding: 0.5rem;
      text-align: left;
    }
    th {
      background-color: #555;
    }
    button {
      display: block;
      margin: 2rem auto 1rem;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .back-button {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: #ccc;
      text-decoration: underline;
    }
    #totalSummary {
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 1rem;
    }
    @media screen and (max-width: 600px) {
      body {
        padding: 1rem;
        font-size: 0.95rem;
      }
      h1 {
        font-size: 1.4rem;
        text-align: center;
      }
      .section {
        padding: 1rem;
        margin: 0.5rem 0;
      }
      .entry {
        padding: 0.75rem;
        margin-bottom: 1rem;
      }
      .field {
        margin: 0.4rem 0;
      }
      .field label {
        display: block;
        margin-bottom: 0.2rem;
        font-weight: bold;
        font-size: 0.9rem;
      }
      .field span {
        display: block;
        font-size: 0.95rem;
      }
      .action-buttons {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        margin-top: 1.5rem;
      }
      .action-buttons button {
        font-size: 1rem;
        padding: 0.6rem;
        width: 100%;
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
  <h1>預覽與確認送出</h1>

  <h2>基本資料確認</h2>
  <div class="preview-box" id="previewBasic">
    <div class="item">陽上報恩人：<span id="previewName"></span></div>
    <div class="item">手機號碼：<span id="previewPhone"></span></div>
    <div class="item">地址：<span id="previewAddress"></span></div>
  </div>

  <div id="previewArea"></div>
  <div id="totalSummary">赞助總金額：0 元</div>

  <button id="downloadPdfBtn">下載 PDF 預覽</button>
  <button id="submitButton">確認送出</button>
  <a class="back-button" href="main.html">← 返回填寫其他項目</a>

  <script>
    const allData = JSON.parse(localStorage.getItem("allFormData") || "{}");

    if (!allData.phone || !allData.name || !allData.address) {
      alert("請先填寫基本資料！");
      window.location.href = "index.html";
    }

    document.getElementById("previewName").textContent = allData.name;
    document.getElementById("previewPhone").textContent = allData.phone;
    document.getElementById("previewAddress").textContent = allData.address;

    const previewArea = document.getElementById("previewArea");

    const itemLabelsMap = {
      ancestor: { ancestorName: "祖先/亡灵名字", placeType: "種類", location: "安奉地點", token: "超度令牌", boat: "法船配套", lotus: "蓮花", paper3: "纸金 3", paper6: "纸金 6", paper27: "纸金 27", extra: "配套備註" },
      baby: { yang: "陽上對象", location: "水子靈 蓮位 / 安奉地點", token: "超度令牌", boat: "法船配套", lotus: "蓮花", paper3: "纸金 3", paper6: "纸金 6", paper27: "纸金 27", extra: "配套備註" },
      enemy: { yang: "陽上對象", location: "超度對象 / 安奉地點", token: "超度令牌", boat: "法船配套", lotus: "蓮花", paper3: "纸金 3", paper6: "纸金 6", paper27: "纸金 27", extra: "配套備註" },
      past: { yang: "陽上對象", token: "超度令牌", boat: "法船配套", lotus: "蓮花", paper3: "纸金 3", paper6: "纸金 6", paper27: "纸金 27", extra: "配套備註" },
      ground: { location: "地基主 / 土地公 地址", token: "超度令牌", boat: "法船配套", lotus: "蓮花", paper3: "纸金 3", paper6: "纸金 6", paper27: "纸金 27", extra: "配套備註" }
    };

    const itemPrices = {
      token: 5, boat: 30, lotus: 6, paper3: 3, paper6: 6, paper27: 27
    };

    const sections = [
      { key: "ancestor", label: "祖先超度", count: 8 },
      { key: "baby", label: "水子靈超度", count: 8 },
      { key: "enemy", label: "纏身靈 / 冤親債主超度", count: 5 },
      { key: "past", label: "前世今生所殺生靈超度", count: 4 },
      { key: "ground", label: "地基主 / 土地公超度", count: 2 }
    ];

    let totalAmount = 0;

    const calcSubtotal = (entry) => {
      let sum = 0;
      for (let key in itemPrices) {
        const val = Number(entry[key] || 0);
        sum += val * itemPrices[key];
      }
      return sum;
    };

    sections.forEach(section => {
      const data = allData[section.key] || [];
      const nonEmpty = data.filter(entry => Object.values(entry).some(v => v));
      if (nonEmpty.length === 0) return;

      const title = document.createElement("div");
      title.className = "section-title";
      title.textContent = section.label;
      previewArea.appendChild(title);

      nonEmpty.forEach(row => {
        const entryBox = document.createElement("div");
        entryBox.className = "preview-box";

        Object.entries(itemLabelsMap[section.key]).forEach(([fieldKey, label]) => {
          const value = row[fieldKey];
          if (value !== undefined && value !== "") {
            const item = document.createElement("div");
            item.className = "item";
            item.textContent = `${label}: ${value}`;
            entryBox.appendChild(item);
          }
        });

        previewArea.appendChild(entryBox);
        totalAmount += calcSubtotal(row);
      });
    });

    document.getElementById("totalSummary").textContent = `總金額：${totalAmount} 元`;

    document.getElementById("submitButton").addEventListener("click", async () => {
      const payload = {
        timestamp: new Date().toISOString(),
        phone: allData.phone,
        name: allData.name,
        address: allData.address,
        ancestor: (allData.ancestor || []).slice(0, 8),
        baby: (allData.baby || []).slice(0, 8),
        enemy: (allData.enemy || []).slice(0, 5),
        past: (allData.past || []).slice(0, 4),
        ground: (allData.ground || []).slice(0, 3),
      };

      const fill = (arr, count) => {
        for (let i = 0; i < count; i++) {
          if (!arr[i]) arr[i] = "";
        }
      };
      fill(payload.ancestor, 8);
      fill(payload.baby, 8);
      fill(payload.enemy, 5);
      fill(payload.past, 4);
      fill(payload.ground, 3);

      try {
        const res = await fetch("https://form.gealarm2012.workers.dev/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const result = await res.text();
        if (result.trim() === "成功") {
          alert("已送出報名資料，感謝您！");
          window.location.href = "index.html";
        } else {
          alert("送出失敗，請稍後再試");
        }
      } catch (err) {
        alert("送出錯誤：" + err.message);
      }
    });

    // ✅ PDF 下載按鈕功能
    document.getElementById("downloadPdfBtn").addEventListener("click", () => {
  const container = document.createElement("div");

  const basicInfo = document.getElementById("previewBasic").cloneNode(true);
  const previewContent = document.getElementById("previewArea").cloneNode(true);

  container.appendChild(basicInfo);
  container.appendChild(previewContent);

  // ✅ 套用 PDF 專用樣式
  container.style.padding = "1rem";
  container.style.backgroundColor = "#fff";
  container.style.color = "#000";
  container.style.fontFamily = "'Noto Sans TC', sans-serif";

  // ✅ 移除可能造成裁切的 max-width 與 margin
  container.querySelectorAll(".preview-box").forEach(box => {
    box.style.maxWidth = "100%";
    box.style.margin = "1rem 0";
    box.style.background = "#f8f8f8";
    box.style.color = "#000";
  });

  const opt = {
    margin: 0.3,
    filename: '預覽確認.pdf',
    image: { type: 'jpeg', quality: 0.9 },
    html2canvas: { scale: 2, scrollY: 0, useCORS: true },
    jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
  };

  html2pdf().set(opt).from(container).save();
});

  </script>
</body>
</html>
