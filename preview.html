<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>預覽與確認送出</title>
  <style>
    body {
      background-color: #3a3a3a;
      color: #f0f0f0;
      font-family: 'Noto Sans TC', sans-serif;
      margin: 0;
      padding: 1rem;
    }
    h1, h2 {
      text-align: center;
      margin-bottom: 1rem;
    }
    .preview-box {
      background: #4a4a4a;
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 2rem;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    .item {
      margin-bottom: 0.5rem;
    }
    .section-title {
      font-weight: bold;
      margin-top: 2rem;
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
      border-bottom: 1px solid #ccc;
      padding-bottom: 0.2rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2rem;
      overflow-x: auto;
    }
    th, td {
      border: 1px solid #666;
      padding: 0.5rem;
      text-align: left;
    }
    th {
      background-color: #555;
    }
    button {
      display: block;
      margin: 2rem auto 1rem;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .back-button {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: #ccc;
      text-decoration: underline;
    }
    #totalSummary {
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <h1>預覽與確認送出</h1>

  <h2>基本資料確認</h2>
  <div class="preview-box">
    <div class="item">陽上報恩人：<span id="previewName"></span></div>
    <div class="item">手機號碼：<span id="previewPhone"></span></div>
    <div class="item">地址：<span id="previewAddress"></span></div>
  </div>

  <div id="previewArea"></div>
  <div id="totalSummary">總金額：0 元</div>

  <button id="submitButton">確認送出</button>
  <a class="back-button" href="main.html">← 返回填寫其他項目</a>

  <script>
    

const allData = JSON.parse(localStorage.getItem("allFormData") || "{}");
const phone = allData.phone || "";
const name = allData.name || "";
const address = allData.address || "";

// 防呆檢查
if (!phone || !name || !address) {
  alert("請先填寫基本資料！");
  window.location.href = "index.html";
}



    // ✅ 防呆：基本資料沒填就強制跳回
    if (!allData.phone || !allData.name || !allData.address) {
      alert("請先填寫基本資料");
      window.location.href = "index.html";
    }

    document.getElementById("previewName").textContent = allData.name;
    document.getElementById("previewPhone").textContent = allData.phone;
    document.getElementById("previewAddress").textContent = allData.address;

    const previewArea = document.getElementById("previewArea");

    const itemLabels = {
      name: "超度對象",
      location: "安奉地點",
      token: "超度令牌",
      boat: "法船配套",
      lotus: "蓮花",
      paper3: "三支香",
      paper6: "六支香",
      paper27: "二十七支香",
      extra: "配套備註"
    };

    const itemPrices = {
      token: 5,
      boat: 30,
      lotus: 6,
      paper3: 3,
      paper6: 6,
      paper27: 27
    };

    const sections = [
      { key: "ancestor", label: "祖先超度", count: 8 },
      { key: "baby", label: "水子靈超度", count: 5 },
      { key: "enemy", label: "纏身靈 / 冤親債主超度", count: 5 },
      { key: "past", label: "前世今生所殺生靈超度", count: 4 },
      { key: "ground", label: "地基主 / 土地公超度", count: 2 }
    ];

    let totalAmount = 0;

    const calcSubtotal = (entry) => {
      let sum = 0;
      for (let key in itemPrices) {
        const val = Number(entry[key] || 0);
        sum += val * itemPrices[key];
      }
      return sum;
    };

    sections.forEach(section => {
      const data = allData[section.key] || [];
      const nonEmpty = data.filter(entry => Object.values(entry).some(v => v));
      if (nonEmpty.length === 0) return;

      const title = document.createElement("div");
      title.className = "section-title";
      title.textContent = section.label;
      previewArea.appendChild(title);

      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const tbody = document.createElement("tbody");

      const headers = Object.keys(itemLabels);
      const tr = document.createElement("tr");
      headers.forEach(h => {
        const th = document.createElement("th");
        th.textContent = itemLabels[h];
        tr.appendChild(th);
      });
      thead.appendChild(tr);

      nonEmpty.forEach(row => {
        const tr = document.createElement("tr");
        headers.forEach(h => {
          const td = document.createElement("td");
          td.textContent = row[h] || "";
          tr.appendChild(td);
        });
        tbody.appendChild(tr);

        totalAmount += calcSubtotal(row);
      });

      table.appendChild(thead);
      table.appendChild(tbody);
      previewArea.appendChild(table);
    });

    document.getElementById("totalSummary").textContent = `總金額：${totalAmount} 元`;

    document.getElementById("submitButton").addEventListener("click", async () => {
      const payload = {
        timestamp: new Date().toISOString(),
        phone: allData.phone,
        name: allData.name,
        address: allData.address,
        ancestor: (allData.ancestor || []).slice(0, 8),
        baby: (allData.baby || []).slice(0, 8),
        enemy: (allData.enemy || []).slice(0, 5),
        past: (allData.past || []).slice(0, 4),
        ground: (allData.ground || []).slice(0, 2),
      };

      const fill = (arr, count) => {
        for (let i = 0; i < count; i++) {
          if (!arr[i]) arr[i] = {};
        }
      };
      fill(payload.ancestor, 8);
      fill(payload.baby, 8);
      fill(payload.enemy, 5);
      fill(payload.past, 4);
      fill(payload.ground, 2);

      try {
        const res = await fetch("https://form.gealarm2012.workers.dev/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        alert("已送出報名資料，感謝您！");
        window.location.href = "index.html";
      } catch (err) {
        alert("送出失敗，請稍後再試");
      }
    });
  </script>
</body>
</html>
