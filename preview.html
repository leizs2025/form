<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>預覽與確認送出</title>
  <style>
    body {
      background-color: #3a3a3a;
      color: #f0f0f0;
      font-family: 'Noto Sans TC', sans-serif;
      margin: 0;
      padding: 1rem;
    }
    h1, h2 {
      text-align: center;
      margin-bottom: 1rem;
    }
    .preview-box {
      background: #4a4a4a;
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 2rem;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    .item {
      margin-bottom: 0.5rem;
    }
    .section-title {
      font-weight: bold;
      margin-top: 2rem;
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
      border-bottom: 1px solid #ccc;
      padding-bottom: 0.2rem;
    }
    input[type="number"] {
      width: 100%;
      padding: 0.6rem;
      font-size: 1rem;
      border: 1px solid #888;
      border-radius: 8px;
      background: #fff;
      color: #333;
      box-sizing: border-box;
    }
    #totalSummary {
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 1rem;
    }
    button {
      display: block;
      margin: 2rem auto 1rem;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .back-button {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: #ccc;
      text-decoration: underline;
    }
   
    .preview-box {
      background: #4a4a4a;
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 2rem;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      position: relative; /* ✨加這行，讓內部元素可以定位 */
}


  </style>
</head>
<body>
<h1>預覽與確認送出</h1>

<h2>基本資料確認</h2>
<div class="preview-box" id="previewBasic">
  <div class="item">陽上報恩人：<span id="previewName"></span></div>
  <div class="item">手機號碼：<span id="previewPhone"></span></div>
  <div class="item">實際送出手機：<span id="previewPhoneWithPrefix"></span></div>
  <div class="item">地址：<span id="previewAddress"></span></div>
  <div class="item">法会类别：<span id="previewFestival"></span></div>
</div>

<div id="previewArea"></div>

<div class="preview-box" style="max-width: 500px; margin: 1rem auto;">
  <label for="donation">一次性 超度報名供養金（隨喜贊助）：</label>
  <input type="number" id="donation" min="0" placeholder="請輸入金額" oninput="updateTotalAmount()" />
</div>

<div id="totalSummary">總金額：0 元</div>

<button id="submitButton">確認送出</button>
<a class="back-button" href="main.html">← 返回填寫其他項目</a>

<script>
const allData = JSON.parse(localStorage.getItem("allFormData") || "{}");
if (!allData.phone || !allData.name || !allData.address) {
  alert("請先填寫基本資料！");
  window.location.href = "index.html";
}

document.getElementById("previewName").textContent = allData.name;
document.getElementById("previewPhone").textContent = allData.phone;
document.getElementById("previewPhoneWithPrefix").textContent = generatePrefixedPhone(allData.phone, allData.festival || "");
document.getElementById("previewAddress").textContent = allData.address;
document.getElementById("previewFestival").textContent = allData.festival || "未填寫";

function generatePrefixedPhone(phone, festival) {
  const yearCode = String(new Date().getFullYear()).slice(-1);
  let prefix = "";
  if (festival === "清明節") prefix = `${yearCode}m`;
  else if (festival === "中元節") prefix = `${yearCode}y`;
  else if (festival === "其他") prefix = `${yearCode}t`;
  return prefix + phone;
}

const itemLabelsMap = {
  ancestor: { ancestorName: "祖先/亡灵名字", placeType: "種類", location: "安奉地點", token: "超度令牌", boat: "法船配套", lotus: "蓮花", paper3: "纸金 3", paper6: "纸金 6", paper27: "纸金 27", extra: "配套備註" },
  baby:     { yang: "陽上對象", location: "水子靈 蓮位 / 安奉地點", token: "超度令牌", boat: "法船配套", lotus: "蓮花", paper3: "纸金 3", paper6: "纸金 6", paper27: "纸金 27", extra: "配套備註" },
  enemy:    { yang: "陽上對象", location: "超度對象 / 安奉地點", token: "超度令牌", boat: "法船配套", lotus: "蓮花", paper3: "纸金 3", paper6: "纸金 6", paper27: "纸金 27", extra: "配套備註" },
  past:     { yang: "陽上對象", token: "超度令牌", boat: "法船配套", lotus: "蓮花", paper3: "纸金 3", paper6: "纸金 6", paper27: "纸金 27", extra: "配套備註" },
  ground:   { location: "地基主 / 土地公 地址", token: "超度令牌", boat: "法船配套", lotus: "蓮花", paper3: "纸金 3", paper6: "纸金 6", paper27: "纸金 27", extra: "配套備註" }
};

const itemPrices = { token: 5, boat: 30, lotus: 6, paper3: 3, paper6: 6, paper27: 27 };
const sections = [
  { key: "ancestor", label: "祖先超度", count: 8 },
  { key: "baby", label: "水子靈超度", count: 5 },
  { key: "enemy", label: "纏身靈 / 冤親債主超度", count: 5 },
  { key: "past", label: "前世今生所殺生靈超度", count: 4 },
  { key: "ground", label: "地基主 / 土地公超度", count: 2 }
];

let totalAmount = 0;
const previewArea = document.getElementById("previewArea");

const calcSubtotal = (entry) => {
  return Object.entries(itemPrices).reduce((sum, [key, price]) => {
    return sum + (Number(entry[key] || 0) * price);
  }, 0);
};
function renderPreviewArea() {
  previewArea.innerHTML = "";
  totalAmount = 0;

  sections.forEach(({ key, label }) => {
    const data = Array.isArray(allData[key]) ? allData[key] : [];

    const filtered = data.filter(entry =>
      Object.values(entry).some(val => val !== "" && val !== null && val !== undefined)
    );

    if (filtered.length === 0) return;

    // 插入分類標題
    const sectionTitle = document.createElement("div");
    sectionTitle.className = "section-title";
    sectionTitle.textContent = label;
    previewArea.appendChild(sectionTitle);

    // 遍歷每一筆
    filtered.forEach((entry, index) => {
      const box = document.createElement("div");
      box.className = "preview-box entry";

      Object.entries(itemLabelsMap[key] || {}).forEach(([field, labelName]) => {
        const value = entry[field];
        if (value !== undefined && value !== "") {
          const item = document.createElement("div");
          item.className = "item";
          item.textContent = `${labelName}: ${value}`;
          box.appendChild(item);
        }
      });

      const subtotal = calcSubtotal(entry);
      const subtotalEl = document.createElement("div");
      subtotalEl.className = "item";
      subtotalEl.style.fontWeight = "bold";
      subtotalEl.textContent = `此項目金額：${subtotal} 元`;
      box.appendChild(subtotalEl);

      // 加刪除按鈕
      const deleteButton = document.createElement("button");
      deleteButton.textContent = "🗑";
      deleteButton.style.position = "absolute";
      deleteButton.style.top = "8px";
      deleteButton.style.right = "12px";
      deleteButton.style.background = "transparent";
      deleteButton.style.border = "none";
      deleteButton.style.color = "#ff6b6b"; // 柔和紅色
      deleteButton.style.cursor = "pointer";
      deleteButton.style.fontSize = "1.2rem"; // 小小的
      deleteButton.onclick = () => deleteEntry(key, index);
      box.appendChild(deleteButton);


      previewArea.appendChild(box);
      totalAmount += subtotal;
    });
  });

  updateTotalAmount();
}

// --- 刪除單筆 ---
function deleteEntry(sectionKey, entryIndex) {
  if (!confirm("確定要刪除這筆資料嗎？")) return;
  allData[sectionKey].splice(entryIndex, 1);
  localStorage.setItem("allFormData", JSON.stringify(allData));
  renderPreviewArea();
}

// --- 金額更新 ---
// --- 金額更新 ---
function updateTotalAmount() {
  const rawVal = document.getElementById("donation")?.value;
  const donation = Number(rawVal || 0);
  const displayAmount = totalAmount + donation;
  document.getElementById("totalSummary").textContent =
    rawVal === "" ? `總金額：${totalAmount} 元` : `總金額：${displayAmount} 元`;
}

// --- 頁面一進來就呼叫一次 ---
renderPreviewArea();

// --- 綁定送出按鈕 ---
document.getElementById("submitButton").addEventListener("click", async (e) => { 
  e.preventDefault(); // 🔥 防止頁面刷新

  const payload = {
    timestamp: new Date().toISOString(),
    phone: generatePrefixedPhone(allData.phone, allData.festival || ""),
    name: allData.name,
    address: allData.address,
    festival: allData.festival || "",
    donation: Number(document.getElementById("donation")?.value || 0),
    ancestor: (allData.ancestor || []).slice(0, 8),
    baby:     (allData.baby || []).slice(0, 5),
    enemy:    (allData.enemy || []).slice(0, 5),
    past:     (allData.past || []).slice(0, 4),
    ground:   (allData.ground || []).slice(0, 2),
  };

  try {
    const res = await fetch("https://form.gealarm2012.workers.dev/gas1", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const result = await res.text();
    if (result && result.includes("成功")) {
      alert("已送出報名資料，感謝您！");
      localStorage.removeItem("allFormData");
      window.location.href = "index.html";
    } else {
      alert("送出失敗，請稍後再試");
    }
  } catch (err) {
    console.error("送出錯誤", err);
    alert("送出錯誤：" + err.message);
  }
});

</script>

</body>
</html>
