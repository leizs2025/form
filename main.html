<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>超度報名主頁</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
    }
    header {
      background-color: #343a40;
      color: white;
      padding: 1rem;
      text-align: center;
      font-size: 1.5rem;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      background: #e9ecef;
      padding: 0.5rem;
    }
    nav button {
      margin: 0.25rem;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      border: none;
      border-radius: 0.5rem;
      background-color: #dee2e6;
      cursor: pointer;
    }
    nav button.active {
      background-color: #495057;
      color: white;
    }
    section {
      display: none;
      padding: 1rem;
    }
    section.active {
      display: block;
    }
  </style>
</head>
<body>
  <header>超度報名表單總入口</header>
  <nav>
    <button data-target="ancestor" class="active">祖先超度</button>
    <button data-target="baby">水子靈超度</button>
    <button data-target="karma">冤親債主</button>
    <button data-target="kill">前世今生所殺生靈</button>
    <button data-target="earth">地基主 / 土地公</button>
    <button data-target="preview">資料預覽</button>
  </nav>

  <section id="form-ancestor" class="active">
    <!-- 插入祖先表單 HTML -->
  </section>
  <section id="form-baby">
    <!-- 插入水子靈表單 HTML -->
  </section>
  <section id="form-karma">
    <!-- 插入冤親債主表單 HTML -->
  </section>
  <section id="form-kill">
    <!-- 插入前世今生所殺生靈表單 HTML -->
  </section>
  <section id="form-earth">
    <!-- 插入地基主 / 土地公表單 HTML -->
  </section>
  <section id="preview">
    <!-- 插入資料預覽 HTML -->
  </section>

  <script>
    const buttons = document.querySelectorAll("nav button");
    const sections = document.querySelectorAll("section");
    buttons.forEach((btn) => {
      btn.addEventListener("click", () => {
        buttons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        sections.forEach((sec) => sec.classList.remove("active"));
        document.getElementById(btn.dataset.target).classList.add("active");
      });
    });
  </script>
</body>
</html>
