<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>祈福登记流程</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: 'Noto Serif SC', serif; margin: 0; background: #fefdf6; }
    .step { display: none; padding: 20px; max-width: 600px; margin: auto; }
    .step.active { display: block; }
    h2 { color: #8b0000; text-align: center; }
    label { display: block; margin-top: 15px; font-weight: bold; color: #333; }
    input, select, button {
      width: 100%; padding: 10px; margin-top: 6px;
      font-size: 16px; border-radius: 6px; border: 1px solid #ccc;
      box-sizing: border-box;
    }
    .error { font-size: 13px; color: #d8000c; }
    .btn { margin-top: 25px; background-color: #8b0000; color: #fff; border: none; transition: background 0.3s; cursor: pointer; }
    .btn:hover { background-color: #a10f0f; }
    .prayer-box { border: 1px solid #8b0000; padding: 15px; margin-bottom: 15px; border-radius: 10px; background-color: #fff; }
    .actions, .footer-bar { text-align: center; margin-top: 15px; }
    .footer-bar { border-top: 1px solid #8b0000; padding-top: 10px; font-size: 18px; color: #8b0000; }
    .preview-box { background: #fff; border-left: 4px solid #8b0000; padding: 10px; margin-bottom: 10px; }
    .pdf-area { margin: auto; width: 100%; max-width: 500px; background: #fff; padding: 20px; border-radius: 10px; }
  </style>
</head>
<body>

<!-- Step 1 -->
<div class="step active" id="step1">
  <h2>🙏 祈福登记 · 第一步</h2>
  <label for="phone">手机号</label>
  <input type="text" id="phone" placeholder="请输入手机号" />
  <label for="submitter">填写者姓名</label>
  <input type="text" id="submitter" placeholder="请输入姓名" />
  <label for="category">法会类别</label>
  <select id="category">
    <option value="">--请选择--</option>
    <option value="清明节">清明节</option>
    <option value="中元节">中元节</option>
    <option value="红贵神">红贵神</option>
  </select>
  <button class="btn" onclick="nextStep1()">下一步</button>
</div>

<!-- Step 2 -->
<div class="step" id="step2">
  <h2>🙏 填写祈福者资料</h2>
  <div id="prayerList"></div>
  <div class="actions">
    <button onclick="addPrayer()">➕ 增加一位</button>
    <button onclick="removePrayer()">🗑 删除最后一位</button>
  </div>
  <label>🙏 随喜赞助（一次性金额）</label>
  <input type="number" id="donation" min="0" value="0" oninput="calcTotal()">
  <div class="footer-bar">总金额：<span id="totalPrice">0</span> 元</div>
  <button class="btn" onclick="nextStep2()">预览资料</button>
</div>

<!-- Step 3 -->
<div class="step" id="step3">
  <h2>💾 预览资料</h2>
  <div id="pdfWrapper" class="pdf-area">
    <div id="previewContent"></div>
  </div>
  <div class="footer-bar">总金额：<span id="finalTotal">0</span> 元</div>
  <div class="actions">
    <button onclick="downloadPDF()">📄 下载PDF</button>
    <button onclick="backToStep2()">🔙 返回修改</button>
    <button onclick="submitData()">✅ 最终提交</button>
  </div>
</div>

<script>
let prayers = [], count = 0, maxPeople = 13;
const prices = { token:5, stick:1, gold3:3, gold6:6 };

function nextStep1() {
  const phone = document.getElementById('phone').value.trim();
  const submitter = document.getElementById('submitter').value.trim();
  const category = document.getElementById('category').value;
  if (!phone || !submitter || !category) return alert('\u8bf7\u586b\u5b8c\u57fa\u672c\u8d44\u6599');
  localStorage.setItem('submitter', JSON.stringify({ phone, submitter, category }));
  showStep('step2');
  if (count === 0) addPrayer();
}

function nextStep2() {
  localStorage.setItem('prayers', JSON.stringify(prayers));
  calcTotal();
  renderPreview();
  showStep('step3');
}

function backToStep2() { showStep('step2'); }

function showStep(id) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function addPrayer() {
  if (count >= maxPeople) return alert("\u6700\u591a13\u4f4d");
  prayers.push({ name:"", address:"", token:0, stick:0, gold3:0, gold6:0 });
  renderPrayers();
}

function removePrayer() {
  if (prayers.length > 1) { prayers.pop(); renderPrayers(); }
}

function renderPrayers() {
  count = prayers.length;
  const list = document.getElementById('prayerList');
  list.innerHTML = '';
  prayers.forEach((p, i) => {
    list.innerHTML += `
      <div class='prayer-box'>
        <h3>第 ${i+1} 位</h3>
        <label>姓名</label><input value="${p.name}" onchange="prayers[${i}].name=this.value">
        <label>地址</label><input value="${p.address}" onchange="prayers[${i}].address=this.value">
        <label>祈福令牌 (5元)</label><input type='number' min='0' value="${p.token}" onchange="prayers[${i}].token=this.value;calcTotal()">
        <label>小护摩片 (1元)</label><input type='number' min='0' value="${p.stick}" onchange="prayers[${i}].stick=this.value;calcTotal()">
        <label>纸金3</label><input type='number' min='0' value="${p.gold3}" onchange="prayers[${i}].gold3=this.value;calcTotal()">
        <label>纸金6</label><input type='number' min='0' value="${p.gold6}" onchange="prayers[${i}].gold6=this.value;calcTotal()">
      </div>`;
  });
  calcTotal();
}

function calcTotal() {
  let total = prayers.reduce((sum, p) => sum + p.token*5 + p.stick*1 + p.gold3*3 + p.gold6*6, 0);
  total += +(document.getElementById('donation')?.value || 0);
  document.getElementById('totalPrice').textContent = total.toFixed(2);
}

function renderPreview() {
  const data = JSON.parse(localStorage.getItem('submitter') || '{}');
  const preview = document.getElementById('previewContent');
  const donation = +(document.getElementById('donation')?.value || 0);
  let html = `<div>填写者：${data.submitter}<br>手机：${data.phone}<br>法会类别：${data.category}</div><hr>`;
  prayers.forEach((p,i) => {
    html += `<div class='preview-box'><strong>第${i+1}位</strong><br>姓名：${p.name}<br>地址：${p.address}`;
    if(p.token) html+=`<br>祈福令牌：${p.token}`;
    if(p.stick) html+=`<br>小护摩片：${p.stick}`;
    if(p.gold3) html+=`<br>纸金3：${p.gold3}`;
    if(p.gold6) html+=`<br>纸金6：${p.gold6}`;
    html += `</div>`;
  });
  if(donation){ html+=`<div class='preview-box'><strong>随喜赞助</strong><br>${donation} 元</div>`; }
  document.getElementById('finalTotal').textContent = document.getElementById('totalPrice').textContent;
  preview.innerHTML = html;
}

function downloadPDF() {
  html2canvas(document.getElementById('pdfWrapper')).then(canvas => {
    const imgData = canvas.toDataURL('image/jpeg', 0.5);
    const pdf = new jspdf.jsPDF();
    pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
    pdf.save('祈福资料.pdf');
  });
}

function submitData() {
  const submitter = JSON.parse(localStorage.getItem('submitter')||'{}');
  const prayers = JSON.parse(localStorage.getItem('prayers')||'[]');
  const donation = +(document.getElementById('donation')?.value||0);
  const total = document.getElementById('totalPrice')?.textContent || '0';
  const prefixMap = { '清明节': '5m', '中元节': '5y', '红贵神': '5h' };
  const phoneWithPrefix = (prefixMap[submitter.category]||'') + submitter.phone;
  const payload = { phone: phoneWithPrefix, filler: submitter.submitter, category: submitter.category, prayers, donation, total };

  fetch('https://form.gealarm2012.workers.dev/gas2', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
  }).then(res=>res.text()).then(()=>{
    alert('🙏 提交成功');
    localStorage.clear();
    location.reload();
  }).catch(err=>{
    console.error(err);
    alert('⚠️ 提交失败');
  });
}
</script>
</body>
</html>
