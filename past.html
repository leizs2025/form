<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>前世今生所殺生靈超度</title>
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      padding: 1rem;
      background-color: #3a3a3a;
      color: #f0f0f0;
    }
    h1, h2 {
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .entry {
      background: #4a4a4a;
      border-radius: 1rem;
      padding: 1rem;
      margin-bottom: 1rem;
      box-shadow: 0 0 8px rgba(0,0,0,0.2);
    }
    label {
      display: block;
      margin-top: 0.75rem;
      font-size: 0.95rem;
    }
    input {
      width: 100%;
      padding: 0.6rem;
      font-size: 1rem;
      border: 1px solid #888;
      border-radius: 0.5rem;
      background: #fff;
      color: #333;
      box-sizing: border-box;
    }
    button {
      background: #555;
      color: white;
      border: none;
      padding: 0.8rem 1.2rem;
      font-size: 1rem;
      margin: 0.5rem 0.25rem;
      border-radius: 1rem;
      cursor: pointer;
      width: auto;
    }
    button:hover {
      background: #666;
    }
    .danger {
      background: #b23c3c;
    }
    .btn-back {
      display: block;
      text-align: center;
      margin: 2rem auto 0;
      font-size: 1rem;
      background: #888;
      color: white;
      border-radius: 1rem;
      padding: 0.6rem 1.2rem;
      width: fit-content;
    }
    .btn-back:hover {
      background: #aaa;
    }
    .center-buttons {
      text-align: center;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

<h1>超度報名表單</h1>
<h2>前世今生所殺生靈超度</h2>

<div id="entries"></div>

<div class="center-buttons">
  <button onclick="addEntry()">➕ 新增一位</button>
  <button onclick="previewAndSubmit()">📋 預覽並提交</button>
</div>

<h2 id="totalDisplay">總金額：0 元</h2>

<button class="btn-back" onclick="goBack()">⬅️ 回主入口</button>

<script>
let entries = [];

function addEntry(data = {}) {
  if (entries.length >= 4) return alert("最多可填寫 4 位");

  const index = entries.length;
  const container = document.createElement("div");
  container.className = "entry";
  container.dataset.index = index;

  container.innerHTML = `
    <label>陽上報恩人：</label>
    <input type="text" class="yang-input" name="yang" />

    <label>超度令牌 (5元/份)：</label>
    <input type="number" class="token-input" name="token" min="0" oninput="updateTotal()" />

    <label>法船配套 (30元/份)：</label>
    <input type="number" class="boat-input" name="boat" min="0" oninput="updateTotal()" />

    <label>蓮花 (6元/份)：</label>
    <input type="number" class="lotus-input" name="lotus" min="0" oninput="updateTotal()" />

    <label>紙金3 (3元/份)：</label>
    <input type="number" class="paper3-input" name="paper3" min="0" oninput="updateTotal()" />

    <label>紙金6 (6元/份)：</label>
    <input type="number" class="paper6-input" name="paper6" min="0" oninput="updateTotal()" />

    <label>紙金27 (27元/份)：</label>
    <input type="number" class="paper27-input" name="paper27" min="0" oninput="updateTotal()" />

    <label>配套備註：</label>
    <input type="text" class="extra-input" name="extra" />

    ${index > 0 ? `<button class="danger" onclick="removeEntry(${index})">🗑️ 刪除此位</button>` : ''}
  `;

  document.getElementById("entries").appendChild(container);
  entries.push(container);
  restoreEntryData(container, data);
  bindAutoSave(container);
  updateTotal();
}

function removeEntry(index) {
  entries[index].remove();
  entries.splice(index, 1);
  updateTotal();
  saveAllEntries();
}

function updateTotal() {
  let subtotal = 0;
  for (let container of entries) {
    const getValue = (cls, unit) => {
      const val = Number(container.querySelector(`.${cls}`).value || 0);
      return val * unit;
    };
    subtotal += getValue("token-input", 5);
    subtotal += getValue("boat-input", 30);
    subtotal += getValue("lotus-input", 6);
    subtotal += getValue("paper3-input", 3);
    subtotal += getValue("paper6-input", 6);
    subtotal += getValue("paper27-input", 27);
  }
  document.getElementById("totalDisplay").textContent = `總金額：${subtotal} 元`;
}

function bindAutoSave(container) {
  const inputs = container.querySelectorAll("input, select");
  inputs.forEach(input => {
    input.addEventListener("input", () => saveAllEntries());
  });
}

function restoreAllEntries() {
  const stored = JSON.parse(localStorage.getItem("allFormData") || "{}");
  const list = stored.past || [];
  list.forEach(data => addEntry(data));
}

function saveAllEntries() {
  const stored = JSON.parse(localStorage.getItem("allFormData") || "{}");
  const filled = entries.map(container => {
    const row = {};
    container.querySelectorAll("input, select").forEach(input => {
      row[input.name] = input.value;
    });
    return row;
  });
  stored.past = filled;
  localStorage.setItem("allFormData", JSON.stringify(stored));
}

function restoreEntryData(container, data) {
  container.querySelectorAll("input, select").forEach(input => {
    input.value = data[input.name] || "";
  });
}

function previewAndSubmit() {
  saveAllEntries();
  window.location.href = "preview.html";
}

function goBack() {
  window.location.href = "main.html";
}

window.onload = () => {
  restoreAllEntries();
  if (entries.length === 0) addEntry();
};
</script>


</body>
</html>
